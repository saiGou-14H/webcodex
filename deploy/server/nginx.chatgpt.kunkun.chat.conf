server {
    listen 80;
    server_name chatgpt.kunkun.chat;

    root /www/dk_project/wwwroot/chatgpt.kunkun.chat;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://chatgpt.kunkun.chat$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chatgpt.kunkun.chat;

    ssl_certificate /etc/letsencrypt/live/chatgpt.kunkun.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatgpt.kunkun.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ChatgptWebcodexSSL:20m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 临时静态下载区：供 Windows 机器拉取 WebCodex win 二进制（绕过 GitHub）
    location ^~ /webcodex-dl/ {
        alias /www/dk_project/wwwroot/webcodex-dl/;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        autoindex on;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 200m;
    }
}
